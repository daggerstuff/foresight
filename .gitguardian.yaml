# ggshield configuration — secret-scan exclusions.
#
# `version: 2` is REQUIRED: without it ggshield falls back to the legacy config
# format and silently ignores `secret.ignored_paths`, re-scanning .git/config.
version: 2

# `secret.ignored_paths` (v2 nested key) is the authoritative exclusion list for
# both the pre-commit gate (.pre-commit-config.yaml) and the CI tree scan
# (.github/workflows/secrets-scan.yml). We keep it here so the two scanners
# never drift.
secret:
  # `.git/` is excluded because its `config` carries remote URLs
  # (git@host:org/repo) that ggshield mis-flags as secrets in CI submodule
  # checkouts. VCS internals are never secret-bearing by design.
  #
  # Trailing slashes are REQUIRED: ggshield's path matcher (`is_path_excluded`)
  # only matches directory *contents* when the pattern ends in `/`. A bare `.git`
  # matches only a file literally named `.git` and would still scan `.git/config`.
  ignored_paths:
    - .git/
    - .venv/
    - dist/
    - build/
    - node_modules/
    - '*.min.js'
    # `.github/workflows/publish.yml` pins `POSTGRES_PASSWORD: postgres` on the
    # throwaway `postgres:17` service container in its `test` job. That is an
    # ephemeral, job-local fixture reachable only from inside the runner — not
    # a credential, and not a secret this repository holds. The publish job
    # authenticates to PyPI with OIDC (`id-token: write`), and the file
    # references `secrets.*` zero times.
    #
    # Scoped to this one file on purpose: a broader pattern would hide real
    # detections. No trailing slash — that rule applies to entries naming a
    # directory, and this entry names a single file.
    - .github/workflows/publish.yml
    - tests/test_secret_defense.py
    # The scrubber's own tests: every sample here is a synthetic fixture that
    # exists to prove redaction works. Both files build them from fragments so
    # no complete literal is stored, but a future fixture edit would otherwise
    # re-open the same incident. Scoped to these two files, never to `tests/`.
    - tests/test_gated_recall.py
