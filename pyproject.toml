[project]
name = "foresight"
version = "0.19.0"
description = "Persistent memory for AI agents — CLI, TUI, MCP server, and Python SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Foresight Team", email = "team@vectorize.io" }]
keywords = [
  "mcp",
  "memory",
  "ai",
  "foresight",
  "cli",
  "tui",
  "claude",
  "llm",
  "agent",
  "continuity",
  "context",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]

dependencies = [
  "fastmcp>=4.1.8",
  # Imported directly (mcp.types.TextContent, mcp.server.auth) but otherwise
  # arrives transitively through fastmcp[client,server] — not a contract we own.
  # Lower bound is the 2.0 rename of CallToolResult.isError to is_error.
  "mcp>=2.3.0,<3.0.0",
  "python-dotenv>=1.2.4",
  "psycopg[binary,pool]>=3.3.9",
  "redis>=8.1.0,<9.0",
  "psycopg-pool>=3.3.3",
  "httpx>=0.28.1,<1.0.0",
  "cryptography>=50.0.2",
]

[project.optional-dependencies]
cli = ["rich>=15.0.0"]
tui = ["textual>=8.2.8"]
redis = ["redis>=8.1.0"]
# Local sentence embeddings (PIX-4701). Opt-in because fastembed pulls in
# onnxruntime, whose wheels are large (~200MB) and missing on a few platforms;
# a hard dependency would break installation there. With
# FORESIGHT_EMBEDDING_PROVIDER=auto the server uses this when present, and warns
# loudly before falling back to the dependency-free local-hash embedder.
embeddings = ["fastembed>=0.9.1"]
# Document ingestion (PIX-4704). Opt-in and fully local: pypdf extracts text
# from PDFs, pytesseract+Pillow OCR raster images (also needs the `tesseract`
# binary on PATH). Kept optional so a bare install stays dependency-light.
pdf = ["pypdf>=7.1.0"]
ocr = ["pytesseract>=0.3.13", "Pillow>=13.0.0"]
documents = ["foresight[pdf,ocr]"]
all = ["foresight[cli,tui,redis,embeddings,pdf,ocr]"]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.5.0",
  "pytest-cov>=7.1.0",
  "rich>=15.0.0",
  "textual>=8.2.8",
  "hatchling>=1.33.0",
  "build>=1.6.1",
  "twine>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/daggerstuff/foresight"
Repository = "https://github.com/daggerstuff/foresight"
Documentation = "https://foresight.vectorize.io"
Issues = "https://github.com/daggerstuff/foresight/issues"
Changelog = "https://github.com/daggerstuff/foresight/releases"

[project.scripts]
foresight-server = "foresight.__main__:main"
foresight-cli = "foresight_cli.cli:main"
foresight = "foresight_cli.cli:main"

# Evaluation harness (PIX-3953)
eval-run = "foresight.eval_harness:run_eval"
eval-baseline = "foresight.eval_harness:run_eval"

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.5.0",
  "pytest-cov>=7.1.0",
  "rich>=15.0.0",
  "textual>=8.2.8",
  "ruff>=0.17.5",
  "bandit>=1.9.4",
  "twine>=7.0.0",
  "mypy>=2.4.1",
  "argon2-cffi>=25.1.0",
  "bcrypt>=5.0.0",
  "pillow>=13.0.0",
  "pypdf>=7.1.0",
  "pytesseract>=0.3.13",
  "psycopg[binary]>=3.3.9",
  "psycopg-pool>=3.3.3",
  "fastembed>=0.9.1",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
  "node_modules",
  "venv",
  ".venv",
  "env",
  "build",
  "dist",
  ".git",
  "**/__pycache__",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "N",
  "UP",
  "B",
  "A",
  "C4",
  "DTZ",
  "PIE",
  "PT",
  "Q",
  "RET",
  "SIM",
  "T20",
  "TID",
  "ARG",
  "PL",
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"foresight/server.py" = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "ARG001", "A002"]
"foresight/profile_export.py" = ["A002"]
"foresight/llm_client.py" = ["PLR0913"]
"foresight/tenant_middleware.py" = ["PLR0912"]
"foresight/memory_maintenance.py" = ["PLR0912", "PLR0915"]
"foresight/memory_gc.py" = ["PLR0915"]
"foresight/hybrid_retriever.py" = ["PLR0912", "PLR0915"]
"foresight/reflection_narrative.py" = ["PLR0912"]
"foresight/narrative_cache.py" = ["ARG002"]
"foresight/entity_extractor.py" = ["ARG002"]
"foresight/subconscious.py" = ["PLR0912"]
"foresight/user_lanes.py" = ["PLR0912", "PLR0915"]
"foresight/ghost_cleanup.py" = ["PLR0912", "PLR0915"]
"foresight/stream_producer.py" = ["ARG002"]
"foresight/proof_benchmark.py" = ["E402", "ARG001"]
"foresight/consumer_group.py" = ["E402"]
"foresight/__main__.py" = ["E402"]
"foresight_cli/**" = ["PLR0912", "PLR0913", "E402", "B008", "ARG001"]
"foresight_cli/commands/system.py" = ["PLR0915"]
"tests/*" = [
  "PLC0415",
  "ARG001",
  "PLR0913",
  "SIM115",
  "ARG005",
  "PT019",
  "E402",
  "PT012",
]
"scripts/*" = ["T201", "E402", "N999"]
# Hermes provider plugin. Two entries, each mirroring an established precedent
# in this table rather than inventing a new exemption:
# - cli.py is a print-driven terminal entry point (like scripts/*), so T201 is
#   the same exemption for the same kind of surface.
# - __init__.py implements the external MemoryProvider protocol, whose hook
#   signatures are fixed by Hermes: keyword args such as session_id, rewound and
#   metadata must keep their names even when a hook does not read them (the same
#   ARG002 exemption narrative_cache.py / entity_extractor.py / stream_producer.py
#   carry), and _dispatch is an if-chain tool dispatcher (the same PLR0911
#   exemption foresight/server.py carries).
"plugins/hermes/cli.py" = ["T201"]
"plugins/hermes/__init__.py" = ["ARG002", "PLR0911"]

[tool.ruff.lint.isort]
known-first-party = ["foresight", "foresight_cli"]
combine-as-imports = true
force-single-line = false

[tool.mypy]
# The lowest interpreter the package supports (requires-python = ">=3.12",
# and [tool.ruff] target-version = "py312"). Checking against 3.12 rather than
# the interpreter running mypy is the conservative choice: it rejects use of
# stdlib features that only exist on 3.13/3.14 and would break a 3.12 install.
python_version = "3.12"
# `pytesseract` ships no `py.typed` marker and there is no `types-pytesseract`
# distribution on PyPI, so no stub package exists to install. Rather than
# fabricate a stub for it, the one guarded call site in
# `foresight/document_ingestion.py` binds it with `importlib.import_module`,
# which mypy reads as `Any`. The import stays inside the function's
# `try/except ImportError` so the `foresight[ocr]` extra remains genuinely
# optional: text and PDF ingestion must not require it.
# No strictness flags and no per-module overrides are set here. The defaults are
# what the gate measures; this section exists so the command runs at all, not to
# redefine or narrow what it reports. Every import resolves for real — the
# optional extras are installed in the dev dependency group.
warn_unused_configs = true
warn_redundant_casts = true
show_error_codes = true

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
extraPaths = [".venv/lib/python3.14/site-packages"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foresight", "foresight_cli"]

[tool.hatch.build.targets.sdist]
include = [
  "/foresight",
  "/foresight_cli",
  "/scripts",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[tool.bandit]
exclude_dirs = ["tests"]


[tool.radarlint]
exclude_dirs = ["tests"]
skip_rules = ["python:S1244"]

