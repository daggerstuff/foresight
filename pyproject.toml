[project]
name = "foresight"
version = "0.19.0"
description = "Persistent memory for AI agents — CLI, TUI, MCP server, and Python SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Foresight Team", email = "team@vectorize.io" }]
keywords = [
  "mcp",
  "memory",
  "ai",
  "foresight",
  "cli",
  "tui",
  "claude",
  "llm",
  "agent",
  "continuity",
  "context",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]

dependencies = [
  "fastmcp>=4.0.0b3",
  "psycopg[binary,pool]>=3.3.4",
  "redis>=8.1.0,<9.0",
  "psycopg-pool>=3.3.1",
  "httpx>=0.28.1,<1.0.0",
  "cryptography>=50.0.1",
]

[project.optional-dependencies]
cli = ["typer>=0.27.1", "rich>=15.0.0"]
tui = ["textual>=8.2.8"]
redis = ["redis>=8.1.0"]
all = ["foresight[cli,tui,redis]"]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "typer>=0.27.1",
  "rich>=15.0.0",
  "textual>=8.2.8",
  "hatchling>=1.32.0",
  "build>=1.5.0",
  "twine>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/daggerstuff/foresight"
Repository = "https://github.com/daggerstuff/foresight"
Documentation = "https://foresight.vectorize.io"
Issues = "https://github.com/daggerstuff/foresight/issues"
Changelog = "https://github.com/daggerstuff/foresight/releases"

[project.scripts]
foresight-server = "foresight.__main__:main"
foresight-cli = "foresight_cli.cli:main"
foresight = "foresight_cli.cli:main"

# Evaluation harness (PIX-3953)
eval-run = "foresight.eval_harness:run_eval"
eval-baseline = "foresight.eval_harness:run_eval"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "typer>=0.27.1",
  "rich>=15.0.0",
  "textual>=8.2.8",
  "ruff>=0.16.4",
  "bandit>=1.9.4",
]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
  "node_modules",
  "venv",
  ".venv",
  "env",
  "build",
  "dist",
  ".git",
  "**/__pycache__",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "N",
  "UP",
  "B",
  "A",
  "C4",
  "DTZ",
  "PIE",
  "PT",
  "Q",
  "RET",
  "SIM",
  "T20",
  "TID",
  "ARG",
  "PL",
  "RUF",
]
# PLC0415: function-level imports are an intentional pattern here — the MCP
# server lazily imports heavy subsystems to keep startup fast.
# PLW0603: module-singleton accessors (get_pool, get_event_bus, …) are the
# established state-management pattern across this codebase.
ignore = ["E501", "UP017", "PLR2004", "PLC0415", "PLR0917", "PLW0603"]

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.per-file-ignores]
"foresight/server.py" = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "ARG001"]
"foresight/llm_client.py" = ["PLR0913"]
"foresight/tenant_middleware.py" = ["PLR0912"]
"foresight/memory_maintenance.py" = ["PLR0912", "PLR0915"]
"foresight/memory_gc.py" = ["PLR0915"]
"foresight/hybrid_retriever.py" = ["PLR0915"]
"foresight/reflection_narrative.py" = ["PLR0912"]
"foresight/narrative_cache.py" = ["ARG002"]
"foresight/entity_extractor.py" = ["ARG002"]
"foresight/subconscious.py" = ["PLR0912"]
"foresight/stream_producer.py" = ["ARG002"]
"foresight/proof_benchmark.py" = ["E402", "ARG001"]
"foresight/consumer_group.py" = ["E402"]
"foresight/__main__.py" = ["E402"]
"foresight_cli/**" = ["PLR0912", "PLR0913", "E402", "B008", "ARG001"]
"foresight_cli/commands/system.py" = ["PLR0915"]
"tests/*" = ["PLC0415", "ARG001", "PLR0913", "SIM115", "ARG005", "PT019", "E402", "PT012"]
"scripts/*" = ["T201", "E402", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["foresight", "foresight_cli"]
combine-as-imports = true
force-single-line = false

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
extraPaths = [".venv/lib/python3.13/site-packages"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foresight", "foresight_cli"]

[tool.hatch.build.targets.sdist]
include = [
  "/foresight",
  "/foresight_cli",
  "/scripts",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[tool.bandit]
exclude_dirs = ["tests"]


[tool.radarlint]
exclude_dirs = ["tests"]
skip_rules = ["python:S1244"]


