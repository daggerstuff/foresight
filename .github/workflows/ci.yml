name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format verification
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Tests run against PostgreSQL (the production backend — SQLite is not
      # supported at runtime). FORESIGHT_DB_URL must stay mapped here or
      # conftest.py skips the whole session and pytest exits 1.
      #
      # Each matrix leg gets a FRESH database (dropped + recreated per run):
      # the suite assumes isolation between runs and between legs — a shared
      # persistent DB breaks dedup/hard-cap/narrative-cache expectations.
      - name: Ensure test database exists
        env:
          FORESIGHT_DB_URL: ${{ secrets.FORESIGHT_DB_URL }}
        run: |
          PYTAG=$(echo "${{ matrix.python-version }}" | tr -d '.')
          export FORESIGHT_TEST_DB_NAME="foresight_test_${PYTAG}"
          uv run python - <<'PY'
          import os, urllib.parse
          url = os.environ['FORESIGHT_DB_URL']
          test_db = os.environ['FORESIGHT_TEST_DB_NAME']
          parsed = urllib.parse.urlparse(url)
          # connect to the default db to manage databases
          base = parsed._replace(path='/postgres', query=parsed.query).geturl()
          test_url = parsed._replace(path=f'/{test_db}', query=parsed.query).geturl()
          import psycopg
          try:
              with psycopg.connect(base) as conn:
                  conn.autocommit = True
                  with conn.cursor() as cur:
                      cur.execute('SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname=%s AND pid <> pg_backend_pid()', (test_db,))
                      cur.execute(f'DROP DATABASE IF EXISTS "{test_db}"')
                      cur.execute(f'CREATE DATABASE "{test_db}"')
          except Exception as e:
              print(f'Warning: could not ensure test db: {e}')
          with open(os.environ['GITHUB_ENV'], 'a') as env_file:
              env_file.write(f'FORESIGHT_TEST_DB_URL={test_url}\n')
          PY
        # FORESIGHT_TEST_DB_URL is written to GITHUB_ENV so conftest.py picks
        # the per-leg fresh database via its documented override.

      - name: Run unit tests
        env:
          FORESIGHT_DB_URL: ${{ secrets.FORESIGHT_DB_URL }}
        run: |
          uv run pytest tests/ --cov=foresight --cov-report=lcov --cov-report=term --cov-fail-under=60

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.lcov
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Bandit security scan
        run: uv run bandit -c pyproject.toml -r foresight foresight_cli scripts

      - name: Trivy vulnerability and secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
