name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format verification
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Tests run against PostgreSQL (the production backend — SQLite is not
      # supported at runtime). FORESIGHT_DB_URL must stay mapped here or
      # conftest.py skips the whole session and pytest exits 1.
      - name: Ensure test database exists
        env:
          FORESIGHT_DB_URL: ${{ secrets.FORESIGHT_DB_URL }}
        run: |
          uv run python - <<'PY'
          import os, urllib.parse
          url = os.environ['FORESIGHT_DB_URL']
          parsed = urllib.parse.urlparse(url)
          # replace database name with postgres to connect to default db
          base = parsed._replace(path='/postgres', query=parsed.query).geturl()
          import psycopg
          try:
              with psycopg.connect(base) as conn:
                  conn.autocommit = True
                  with conn.cursor() as cur:
                      cur.execute('SELECT 1 FROM pg_database WHERE datname=%s', ('foresight_test',))
                      if not cur.fetchone():
                          cur.execute('CREATE DATABASE foresight_test')
          except Exception as e:
              print(f'Warning: could not ensure test db: {e}')
          PY

      - name: Run unit tests
        env:
          FORESIGHT_DB_URL: ${{ secrets.FORESIGHT_DB_URL }}
        run: |
          uv run pytest tests/ --cov=foresight --cov-report=lcov --cov-report=term --cov-fail-under=60

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.lcov
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Bandit security scan
        run: uv run bandit -c pyproject.toml -r foresight foresight_cli scripts

      - name: Trivy vulnerability and secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
