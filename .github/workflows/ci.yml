name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Ensure test database exists
        env:
          FORESIGHT_DB_URL: ${{ secrets.FORESIGHT_DB_URL }}
        run: |
          python - <<'PY'
          import os, urllib.parse
          url = os.environ['FORESIGHT_DB_URL']
          parsed = urllib.parse.urlparse(url)
          # replace database name with postgres to connect to default db
          base = parsed._replace(path='/postgres', query=parsed.query).geturl()
          import psycopg
          try:
              with psycopg.connect(base) as conn:
                  conn.autocommit = True
                  with conn.cursor() as cur:
                      cur.execute('SELECT 1 FROM pg_database WHERE datname=%s', ('foresight_test',))
                      if not cur.fetchone():
                          cur.execute('CREATE DATABASE foresight_test')
          except Exception as e:
              print(f'Warning: could not ensure test db: {e}')
          PY

      - name: Run unit tests
        env:
          FORESIGHT_DB_URL: ${{ secrets.FORESIGHT_DB_URL }}
        run: |
          uv run pytest tests/ -v --cov=foresight --cov-report=lcov

      - name: Prepare coverage report
        run: |
          mkdir -p coverage
          mv coverage.lcov coverage/lcov.info
